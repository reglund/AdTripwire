<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="AdTripwire">
  <rect x="1" y="1" width="46" height="46" rx="10" fill="#1f2937"/>
  <!-- two anchor posts -->
  <circle cx="9" cy="30" r="3" fill="#e5e7eb"/>
  <circle cx="39" cy="30" r="3" fill="#e5e7eb"/>
  <!-- taut wire with a slight deflection at the trigger point -->
  <path d="M9 30 L24 26 L39 30" fill="none" stroke="#e5e7eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- trigger marker -->
  <circle cx="24" cy="26" r="3.5" fill="#d97706"/>
  <path d="M24 10 V19" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
</svg>
