name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: AdTripwire version and browser (name + version)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Use the synthetic fixture server (docs/testing.md) where possible. Do not paste real URLs with query values, cookies or anything from an evidence export of a real session unless you have redacted it with the strict profile.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no cookie values, full URLs with query values, page content or personal data.
          required: true
