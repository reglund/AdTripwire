name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm indicators:validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm ext:lint
      - run: pnpm ext:package
      - run: pnpm --filter @adtripwire/extension-chromium run ext:lint
      - run: pnpm --filter @adtripwire/extension-chromium run ext:package
      - uses: actions/upload-artifact@v4
        with:
          name: adtripwire-firefox
          path: apps/extension-firefox/web-ext-artifacts/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: adtripwire-chromium
          path: apps/extension-chromium/web-ext-artifacts/*.zip

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
